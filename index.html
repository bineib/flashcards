<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<title>Flashcards — учи английский</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a18;
    --text-secondary: #6b6b68;
    --text-muted: #a0a09d;
    --accent: #378ADD;
    --accent-bg: #E6F1FB;
    --accent-text: #0C447C;
    --success-bg: #E1F5EE;
    --success-text: #085041;
    --warning-bg: #FAEEDA;
    --warning-text: #633806;
    --danger-bg: #FCEBEB;
    --danger-text: #A32D2D;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0f0ee;
      --text-secondary: #a0a09d;
      --text-muted: #6b6b68;
      --accent: #378ADD;
      --accent-bg: #0C447C;
      --accent-text: #B5D4F4;
      --success-bg: #085041;
      --success-text: #9FE1CB;
      --warning-bg: #633806;
      --warning-text: #FAC775;
      --danger-bg: #791F1F;
      --danger-text: #F7C1C1;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .main { flex: 1; padding: 16px; max-width: 520px; margin: 0 auto; width: 100%; }

  .nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    padding: 5px;
    border-radius: 12px;
    border: 0.5px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    padding: 8px 4px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-secondary);
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .tab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { background: var(--bg); color: var(--text); }

  .screen { display: none; }
  .screen.active { display: block; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    border: 0.5px solid var(--border);
  }

  .stat-n { font-size: 26px; font-weight: 600; }
  .stat-l { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .card-scene {
    perspective: 1000px;
    width: 100%;
    height: 210px;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    padding: 20px;
    user-select: none;
  }

  .card-back { transform: rotateY(180deg); }

  .card-hint { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-word { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
  .card-translation { font-size: 24px; font-weight: 600; color: var(--accent); }
  .card-sub { font-size: 18px; font-weight: 500; color: var(--text-secondary); }
  .card-context { font-size: 13px; color: var(--text-secondary); font-style: italic; text-align: center; line-height: 1.5; }

  .show-btn {
    width: 100%;
    padding: 14px;
    background: var(--surface);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    margin-bottom: 12px;
    transition: background 0.15s;
  }

  .show-btn:active { background: var(--bg); }

  .grade-label { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }

  .grade-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .grade-btn {
    padding: 12px 4px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: transform 0.1s;
  }

  .grade-btn:active { transform: scale(0.96); }
  .grade-btn span { font-size: 11px; font-weight: 400; }
  .g1 { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-text); }
  .g2 { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-text); }
  .g3 { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-text); }
  .g4 { background: var(--success-bg); color: var(--success-text); border-color: var(--success-text); }

  .done-box {
    text-align: center;
    padding: 40px 20px;
    background: var(--surface);
    border-radius: 16px;
    border: 0.5px solid var(--border);
  }

  .done-icon { font-size: 48px; margin-bottom: 12px; }
  .done-box h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .done-box p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn-primary:active { opacity: 0.85; }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 0.5px solid var(--border-strong);
    padding: 12px 24px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; margin-top: 20px; }
  .section-title:first-child { margin-top: 0; }

  .form-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .input-group { display: flex; gap: 8px; margin-bottom: 8px; }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 0.5px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    width: 100%;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-muted); }

  .input-full { width: 100%; margin-bottom: 8px; }

  .file-drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    transition: background 0.15s;
    line-height: 1.6;
  }

  .file-drop:active { background: var(--bg); }
  .file-drop svg { width: 28px; height: 28px; margin-bottom: 8px; stroke: var(--text-muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 8px; }

  .file-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.6; }

  .word-list { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; }

  .word-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 0.5px solid var(--border);
    gap: 10px;
  }

  .word-item:last-child { border-bottom: none; }

  .word-info { flex: 1; min-width: 0; }
  .word-en { font-size: 15px; font-weight: 500; }
  .word-ru { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .word-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
  }

  .badge-new { background: var(--accent-bg); color: var(--accent-text); }
  .badge-due { background: var(--warning-bg); color: var(--warning-text); }
  .badge-ok { background: var(--success-bg); color: var(--success-text); }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    border-radius: 6px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .del-btn:active { color: var(--danger-text); }
  .del-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  .bar-row { margin-bottom: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-label span:last-child { font-weight: 500; }
  .bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }

  .export-row { display: flex; gap: 8px; margin-top: 12px; }
  .export-row button { flex: 1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="header">
  <h1>Flashcards</h1>
  <span id="header-info" style="font-size:13px;color:var(--text-muted)"></span>
</header>

<main class="main">
  <nav class="nav">
    <button class="tab active" onclick="showTab('study')" id="tab-study">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Учить
    </button>
    <button class="tab" onclick="showTab('add')" id="tab-add">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      Слова
    </button>
    <button class="tab" onclick="showTab('stats')" id="tab-stats">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>
      Прогресс
    </button>
  </nav>

  <div id="screen-study" class="screen active"></div>
  <div id="screen-add" class="screen"></div>
  <div id="screen-stats" class="screen"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'fc_words_v1';
const STATS_KEY = 'fc_stats_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
}
function save(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{"reviews":0,"days":[]}'); } catch(e) { return {reviews:0,days:[]}; }
}
function saveStats(s) { localStorage.setItem(STATS_KEY, JSON.stringify(s)); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function sm2(card, grade) {
  let {interval=1, reps=0, ef=2.5} = card;
  ef = Math.max(1.3, ef + 0.1 - (5-grade)*(0.08+(5-grade)*0.02));
  if (grade < 2) { reps = 0; interval = 1; }
  else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps++;
  }
  return {...card, interval, reps, ef, due: Date.now() + interval * 86400000};
}

function getDue(words) { return words.filter(w => !w.due || w.due <= Date.now()); }

let queue = [];
let current = null;
let revealed = false;

function buildQueue() {
  queue = getDue(load()).sort(() => Math.random() - 0.5);
}

function showTab(name) {
  ['study','add','stats'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('screen-'+t).classList.toggle('active', t===name);
  });
  if (name==='study') renderStudy();
  if (name==='add') renderAdd();
  if (name==='stats') renderStats();
}

function renderStudy() {
  const words = load();
  const due = getDue(words);
  document.getElementById('header-info').textContent = due.length ? due.length + ' к повторению' : '';
  const pct = words.length ? Math.round((1 - due.length/words.length)*100) : 0;
  const el = document.getElementById('screen-study');

  if (!words.length) {
    el.innerHTML = `
      <div class="done-box">
        <div class="done-icon">📚</div>
        <h2>Добавь первые слова</h2>
        <p>Перейди во вкладку «Слова» и добавь слова вручную или загрузи TXT файл.</p>
        <button class="btn-primary" onclick="showTab('add')">Добавить слова</button>
      </div>`;
    return;
  }

  if (!due.length) {
    el.innerHTML = `
      <div class="stats-row">
        <div class="stat"><div class="stat-n">0</div><div class="stat-l">к повторению</div></div>
        <div class="stat"><div class="stat-n">${words.filter(w=>w.reps>0).length}</div><div class="stat-l">изучено</div></div>
        <div class="stat"><div class="stat-n">${words.length}</div><div class="stat-l">всего</div></div>
      </div>
      <div class="done-box">
        <div class="done-icon">🎉</div>
        <h2>Всё на сегодня!</h2>
        <p>Ты повторил все слова. Возвращайся завтра — интервальное повторение само напомнит нужные слова.</p>
        <button class="btn-secondary" onclick="showTab('add')">Добавить ещё слова</button>
      </div>`;
    return;
  }

  if (!queue.length) buildQueue();
  if (!current) nextCard(false);

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="stat-n">${due.length}</div><div class="stat-l">осталось</div></div>
      <div class="stat"><div class="stat-n">${words.filter(w=>w.reps>0).length}</div><div class="stat-l">изучено</div></div>
      <div class="stat"><div class="stat-n">${words.length}</div><div class="stat-l">всего</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div id="card-area"></div>`;

  renderCard();
}

function renderCard() {
  if (!current) return;
  const ctx = current.ctx ? `<div class="card-context">"${current.ctx}"</div>` : '';
  const intv = current.reps > 0 ? `интервал: ${current.interval} дн.` : 'новое слово';
  document.getElementById('card-area').innerHTML = `
    <div class="card-scene" onclick="reveal()" role="button" aria-label="Показать перевод">
      <div class="card-inner${revealed?' flipped':''}" id="ci">
        <div class="card-face">
          <div class="card-hint">нажми чтобы перевернуть</div>
          <div class="card-word">${current.en}</div>
          <div class="card-hint">${intv}</div>
        </div>
        <div class="card-face card-back">
          <div class="card-translation">${current.ru}</div>
          <div class="card-sub">${current.en}</div>
          ${ctx}
        </div>
      </div>
    </div>
    ${revealed ? `
      <div class="grade-label">Насколько легко вспомнили?</div>
      <div class="grade-row">
        <button class="grade-btn g1" onclick="grade(1)">1<span>Не помню</span></button>
        <button class="grade-btn g2" onclick="grade(2)">2<span>Сложно</span></button>
        <button class="grade-btn g3" onclick="grade(3)">3<span>Хорошо</span></button>
        <button class="grade-btn g4" onclick="grade(4)">4<span>Легко</span></button>
      </div>
    ` : `<button class="show-btn" onclick="reveal()">Показать перевод</button>`}`;
}

function reveal() {
  if (revealed) return;
  revealed = true;
  renderCard();
}

function nextCard(render=true) {
  if (!queue.length) buildQueue();
  current = queue.shift() || null;
  revealed = false;
  if (render) renderCard();
}

function grade(g) {
  const words = load();
  const idx = words.findIndex(w => w.id === current.id);
  if (idx !== -1) words[idx] = sm2(words[idx], g);
  save(words);
  const st = loadStats();
  st.reviews = (st.reviews||0)+1;
  const today = new Date().toDateString();
  if (!st.days) st.days = [];
  if (st.days[st.days.length-1] !== today) st.days = [...st.days, today].slice(-365);
  saveStats(st);
  if (g < 2) queue.push({...current});
  const due = getDue(load());
  if (!queue.length && due.length) buildQueue();
  if (!due.length) { queue=[]; current=null; }
  else nextCard(false);
  renderStudy();
}

function renderAdd() {
  const words = load();
  document.getElementById('screen-add').innerHTML = `
    <div class="section-title">Добавить вручную</div>
    <div class="form-card">
      <div class="input-group">
        <input type="text" id="in-en" placeholder="English word" />
        <input type="text" id="in-ru" placeholder="Перевод" />
      </div>
      <input type="text" id="in-ctx" placeholder="Пример: I eat an apple every day (необязательно)" class="input-full" />
      <button class="btn-primary" onclick="addWord()" style="width:100%">Добавить слово</button>
    </div>

    <div class="section-title">Загрузить из файла</div>
    <div class="file-drop" onclick="document.getElementById('fi').click()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Нажмите для выбора TXT файла
      <div class="file-hint">Формат: одно слово на строку<br><code>apple - яблоко</code> или <code>apple, яблоко</code></div>
    </div>
    <input type="file" id="fi" accept=".txt" style="display:none" onchange="loadFile(this)" />

    <div class="export-row">
      <button class="btn-secondary" onclick="exportWords()">Экспорт TXT</button>
      <button class="btn-secondary" onclick="if(confirm('Удалить все слова?')){save([]);buildQueue();current=null;renderAdd();toast('Все слова удалены')}">Очистить всё</button>
    </div>

    ${words.length ? `
      <div class="section-title" style="margin-top:20px">Все слова (${words.length})</div>
      <div class="word-list">${words.slice().reverse().map(w => {
        const now = Date.now();
        const isDue = !w.due || w.due <= now;
        const isNew = !w.reps;
        const badge = isNew ? '<span class="badge badge-new">новое</span>' : isDue ? '<span class="badge badge-due">к повторению</span>' : '<span class="badge badge-ok">✓</span>';
        const meta = w.reps > 0 ? `повторений: ${w.reps} · интервал: ${w.interval} дн.` : 'ещё не учили';
        return `<div class="word-item">
          <div class="word-info">
            <div class="word-en">${w.en}</div>
            <div class="word-ru">${w.ru}</div>
            <div class="word-meta">${meta}</div>
          </div>
          ${badge}
          <button class="del-btn" onclick="delWord('${w.id}')" aria-label="Удалить">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>`;
      }).join('')}</div>` : '<div class="empty">Нет слов. Добавьте первое!</div>'}`;
}

function addWord() {
  const en = document.getElementById('in-en').value.trim();
  const ru = document.getElementById('in-ru').value.trim();
  const ctx = document.getElementById('in-ctx').value.trim();
  if (!en || !ru) { toast('Введите слово и перевод'); return; }
  const words = load();
  if (words.find(w => w.en.toLowerCase() === en.toLowerCase())) { toast('Такое слово уже есть'); return; }
  words.push({id:uid(), en, ru, ctx, interval:1, reps:0, ef:2.5, due:0});
  save(words);
  buildQueue();
  toast('Слово добавлено');
  renderAdd();
}

function delWord(id) {
  save(load().filter(w => w.id !== id));
  queue = queue.filter(w => w.id !== id);
  if (current && current.id === id) { current = null; }
  renderAdd();
}

function loadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
    const words = load();
    const existing = new Set(words.map(w => w.en.toLowerCase()));
    let added = 0, skipped = 0;
    lines.forEach(line => {
      let en, ru;
      if (line.includes(' - ')) [en, ru] = line.split(' - ', 2);
      else if (line.includes(',')) [en, ru] = line.split(',', 2);
      else { const p = line.trim().split(/\s+/); en=p[0]; ru=p.slice(1).join(' '); }
      en = (en||'').trim(); ru = (ru||'').trim();
      if (!en || !ru) return;
      if (existing.has(en.toLowerCase())) { skipped++; return; }
      words.push({id:uid(), en, ru, ctx:'', interval:1, reps:0, ef:2.5, due:0});
      existing.add(en.toLowerCase());
      added++;
    });
    save(words);
    buildQueue();
    toast(`Добавлено ${added} слов${skipped ? ', пропущено дублей: '+skipped : ''}`);
    renderAdd();
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function exportWords() {
  const words = load();
  if (!words.length) { toast('Нет слов для экспорта'); return; }
  const txt = words.map(w => `${w.en} - ${w.ru}`).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(txt);
  a.download = 'flashcards.txt';
  a.click();
}

function renderStats() {
  const words = load();
  const st = loadStats();
  const days = st.days || [];
  let streak = 0;
  const today = new Date().toDateString();
  for (let i = days.length-1; i >= 0; i--) {
    const diff = Math.round((new Date(today) - new Date(days[i])) / 86400000);
    if (diff === streak) streak++;
    else break;
  }
  const groups = [
    {l:'Новые (не учились)', n: words.filter(w=>!w.reps).length},
    {l:'1–3 дня', n: words.filter(w=>w.reps && w.interval<=3).length},
    {l:'4–7 дней', n: words.filter(w=>w.reps && w.interval>=4 && w.interval<=7).length},
    {l:'Больше недели', n: words.filter(w=>w.reps && w.interval>7).length},
  ];
  const maxN = Math.max(...groups.map(g=>g.n), 1);
  document.getElementById('screen-stats').innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="stat-n">${words.length}</div><div class="stat-l">слов всего</div></div>
      <div class="stat"><div class="stat-n">${st.reviews||0}</div><div class="stat-l">повторений</div></div>
      <div class="stat"><div class="stat-n">${streak}</div><div class="stat-l">дней подряд</div></div>
    </div>
    <div class="section-title">Распределение по интервалам</div>
    <div class="form-card">
      ${groups.map(g=>`
        <div class="bar-row">
          <div class="bar-label"><span style="color:var(--text-secondary)">${g.l}</span><span>${g.n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(g.n/maxN*100)}%"></div></div>
        </div>`).join('')}
    </div>
    <div class="section-title">Последние дни занятий</div>
    <div class="form-card" style="font-size:13px;color:var(--text-secondary);line-height:1.8">
      ${days.length ? days.slice(-7).reverse().map(d => {
        const date = new Date(d);
        return `<div>${date.toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'short'})}</div>`;
      }).join('') : '<div style="color:var(--text-muted)">Ещё нет занятий</div>'}
    </div>`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

buildQueue();
renderStudy();
</script>
</body>
</html>
